openapi: 3.1.0
info:
  title: catalog-service
  version: 1.0.0
  description: >
    Eventos, fechas, recintos (sectores y butacas), tipos de entrada y productos como
    `ItemVendible`, media propia y caché de lectura (ADR-02). Montos en CLP como string decimal.
    La disponibilidad (vendidos / reservados) es de `inventory`. Público vía gateway:
    `/catalog/*` → `/v1/*` y `/catalog/admin/*` → `/v1/admin/*` (roles admin, organizer, seller).
servers:
  - url: http://localhost:3002
security: []
paths:
  /health/live:
    $ref: "./common.yaml#/paths/~1health~1live"
  /health/ready:
    $ref: "./common.yaml#/paths/~1health~1ready"
  /v1/events:
    get:
      operationId: listEvents
      summary: Eventos publicados (cacheado)
      parameters:
        - { name: category, in: query, schema: { $ref: "#/components/schemas/Category" } }
        - { name: city, in: query, schema: { type: string, maxLength: 80 } }
        - { name: q, in: query, schema: { type: string, maxLength: 100 } }
        - { name: sort, in: query, schema: { type: string, enum: [date, popular, price] } }
        - { name: featured, in: query, schema: { type: string, enum: ["true", "false"] } }
      responses:
        "200":
          description: Resúmenes y ciudades disponibles
          content:
            application/json:
              schema:
                type: object
                required: [events, cities]
                properties:
                  events: { type: array, items: { $ref: "#/components/schemas/EventSummary" } }
                  cities: { type: array, items: { type: string } }
  /v1/events/{slug}:
    get:
      operationId: getEvent
      summary: Detalle público de un evento con fechas y tipos de entrada (cacheado)
      parameters: [{ $ref: "#/components/parameters/Slug" }]
      responses:
        "200":
          description: Evento
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/EventSummary"
                  - type: object
                    required: [dates]
                    properties:
                      dates: { type: array, items: { $ref: "#/components/schemas/EventDate" } }
        "404": { $ref: "./common.yaml#/components/responses/Problem" }
  /v1/events/by-id/{id}:
    get:
      operationId: getEventById
      summary: Igual que el detalle por slug, por id (lo usan inventory y queue)
      parameters: [{ $ref: "#/components/parameters/Id" }]
      responses:
        "200":
          description: Evento
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/EventSummary"
                  - type: object
                    required: [queue, dates]
                    properties:
                      queue: { $ref: "#/components/schemas/QueueSettings" }
                      dates: { type: array, items: { $ref: "#/components/schemas/EventDate" } }
        "404": { $ref: "./common.yaml#/components/responses/Problem" }
  /v1/dates/{id}/seat-map:
    get:
      operationId: getSeatMap
      summary: Plano de una fecha (sectores, tipos de entrada y butacas; cacheado)
      parameters: [{ $ref: "#/components/parameters/Id" }]
      responses:
        "200":
          description: Plano
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SeatMap" }
        "404": { $ref: "./common.yaml#/components/responses/Problem" }
  /v1/venues:
    get:
      operationId: listVenues
      summary: Recintos con sus sectores (cacheado)
      responses:
        "200":
          description: Recintos
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items: { type: array, items: { $ref: "#/components/schemas/Venue" } }
  /v1/products:
    get:
      operationId: listProducts
      summary: Productos activos (cacheado)
      parameters:
        - { name: eventId, in: query, schema: { type: string, format: uuid } }
      responses:
        "200":
          description: Productos
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items: { type: array, items: { $ref: "#/components/schemas/PublicProduct" } }
  /v1/products/{slug}:
    get:
      operationId: getProduct
      parameters: [{ $ref: "#/components/parameters/Slug" }]
      responses:
        "200":
          description: Producto
          content:
            application/json:
              schema: { $ref: "#/components/schemas/PublicProduct" }
        "404": { $ref: "./common.yaml#/components/responses/Problem" }
  /v1/media/{id}:
    get:
      operationId: getMedia
      summary: Imagen (WebP re-codificado; caché inmutable, ETag)
      parameters: [{ $ref: "#/components/parameters/Id" }]
      responses:
        "200":
          description: Imagen
          content:
            image/webp:
              schema: { type: string, format: binary }
        "304": { description: Sin cambios (If-None-Match) }
        "404": { $ref: "./common.yaml#/components/responses/Problem" }
  /v1/items/resolve:
    post:
      operationId: resolveItems
      summary: Precio y estado de venta de ítems vendibles de cualquier tipo (ItemVendible)
      description: >
        Lo usa `orders` para armar líneas sin conocer el tipo de ítem. Las referencias inexistentes
        o de un tipo no registrado se omiten.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [items]
              properties:
                items:
                  type: array
                  minItems: 1
                  maxItems: 50
                  items:
                    type: object
                    additionalProperties: false
                    required: [kind, id]
                    properties:
                      kind: { type: string, examples: [ticket_type, product] }
                      id: { type: string, format: uuid }
      responses:
        "200":
          description: Ítems resueltos y tipos registrados
          content:
            application/json:
              schema:
                type: object
                required: [items, kinds]
                properties:
                  items: { type: array, items: { $ref: "#/components/schemas/SellableItem" } }
                  kinds: { type: array, items: { type: string } }
  /v1/admin/media:
    post:
      operationId: uploadMedia
      summary: Sube una imagen (JPEG, PNG, WebP, AVIF o GIF); se re-codifica a WebP sin metadatos
      security: [{ bearer: [] }]
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [file]
              properties:
                file: { type: string, format: binary }
      responses:
        "201":
          description: Imagen guardada
          content:
            application/json:
              schema:
                type: object
                required: [id, contentType, bytes, width, height, url]
                properties:
                  id: { type: string, format: uuid }
                  contentType: { type: string }
                  bytes: { type: integer }
                  width: { type: integer }
                  height: { type: integer }
                  url: { type: string }
        "400": { $ref: "./common.yaml#/components/responses/Problem" }
        "413": { $ref: "./common.yaml#/components/responses/Problem" }
  /v1/admin/events:
    get:
      operationId: adminListEvents
      summary: Eventos administrables (admin todos; organizer los suyos)
      security: [{ bearer: [] }]
      responses:
        "200":
          description: Eventos
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items: { type: array, items: { $ref: "#/components/schemas/Event" } }
    post:
      operationId: adminCreateEvent
      security: [{ bearer: [] }]
      requestBody: { $ref: "#/components/requestBodies/EventInput" }
      responses:
        "201": { $ref: "#/components/responses/Event" }
        "400": { $ref: "./common.yaml#/components/responses/Problem" }
  /v1/admin/events/{id}:
    parameters: [{ $ref: "#/components/parameters/Id" }]
    get:
      operationId: adminGetEvent
      security: [{ bearer: [] }]
      responses:
        "200": { $ref: "#/components/responses/Event" }
        "404": { $ref: "./common.yaml#/components/responses/Problem" }
    put:
      operationId: adminUpdateEvent
      security: [{ bearer: [] }]
      requestBody: { $ref: "#/components/requestBodies/EventInput" }
      responses:
        "200": { $ref: "#/components/responses/Event" }
        "404": { $ref: "./common.yaml#/components/responses/Problem" }
    delete:
      operationId: adminDeleteEvent
      security: [{ bearer: [] }]
      responses:
        "204": { description: Eliminado }
        "404": { $ref: "./common.yaml#/components/responses/Problem" }
  /v1/admin/events/{id}/queue:
    put:
      operationId: adminUpdateEventQueue
      summary: Configura la fila virtual del evento (ADR-06)
      security: [{ bearer: [] }]
      parameters: [{ $ref: "#/components/parameters/Id" }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [enabled, concurrentSlots, windowMinutes]
              properties:
                enabled: { type: boolean }
                opensAt: { type: [string, "null"], format: date-time }
                concurrentSlots: { type: integer, minimum: 1, maximum: 10000 }
                windowMinutes: { type: integer, minimum: 1, maximum: 120 }
                admitBatchMax: { type: integer, minimum: 1, maximum: 1000 }
                waitingMessage: { type: [string, "null"], maxLength: 300 }
      responses:
        "200": { $ref: "#/components/responses/Event" }
        "400": { $ref: "./common.yaml#/components/responses/Problem" }
  /v1/admin/events/{id}/dates:
    post:
      operationId: adminCreateDate
      summary: Agrega una fecha con sus tipos de entrada
      security: [{ bearer: [] }]
      parameters: [{ $ref: "#/components/parameters/Id" }]
      requestBody: { $ref: "#/components/requestBodies/DateInput" }
      responses:
        "201": { $ref: "#/components/responses/Event" }
        "400": { $ref: "./common.yaml#/components/responses/Problem" }
  /v1/admin/dates/{id}:
    parameters: [{ $ref: "#/components/parameters/Id" }]
    put:
      operationId: adminUpdateDate
      summary: Actualiza la fecha; los tipos de entrada enviados se crean o actualizan por sector
      security: [{ bearer: [] }]
      requestBody: { $ref: "#/components/requestBodies/DateInput" }
      responses:
        "200": { $ref: "#/components/responses/Event" }
        "409": { $ref: "./common.yaml#/components/responses/Problem" }
    delete:
      operationId: adminDeleteDate
      security: [{ bearer: [] }]
      responses:
        "200": { $ref: "#/components/responses/Event" }
  /v1/admin/venues:
    get:
      operationId: adminListVenues
      security: [{ bearer: [] }]
      responses:
        "200":
          description: Recintos
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items: { type: array, items: { $ref: "#/components/schemas/Venue" } }
    post:
      operationId: adminCreateVenue
      summary: Crea un recinto (solo admin)
      security: [{ bearer: [] }]
      requestBody: { $ref: "#/components/requestBodies/VenueInput" }
      responses:
        "201": { $ref: "#/components/responses/Venue" }
  /v1/admin/venues/{id}:
    parameters: [{ $ref: "#/components/parameters/Id" }]
    put:
      operationId: adminUpdateVenue
      security: [{ bearer: [] }]
      requestBody: { $ref: "#/components/requestBodies/VenueInput" }
      responses:
        "200": { $ref: "#/components/responses/Venue" }
    delete:
      operationId: adminDeleteVenue
      security: [{ bearer: [] }]
      responses:
        "204": { description: Eliminado }
        "409": { $ref: "./common.yaml#/components/responses/Problem" }
  /v1/admin/venues/{id}/sections:
    post:
      operationId: adminCreateSection
      security: [{ bearer: [] }]
      parameters: [{ $ref: "#/components/parameters/Id" }]
      requestBody: { $ref: "#/components/requestBodies/SectionInput" }
      responses:
        "201":
          description: Sector
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Section" }
  /v1/admin/sections/{id}:
    parameters: [{ $ref: "#/components/parameters/Id" }]
    put:
      operationId: adminUpdateSection
      summary: Actualiza el sector; con `seatGrid` regenera las butacas (409 si tiene entradas)
      security: [{ bearer: [] }]
      requestBody: { $ref: "#/components/requestBodies/SectionInput" }
      responses:
        "200":
          description: Sector
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Section" }
        "409": { $ref: "./common.yaml#/components/responses/Problem" }
    delete:
      operationId: adminDeleteSection
      security: [{ bearer: [] }]
      responses:
        "204": { description: Eliminado }
        "409": { $ref: "./common.yaml#/components/responses/Problem" }
  /v1/admin/sections/{id}/seats:
    get:
      operationId: adminListSeats
      security: [{ bearer: [] }]
      parameters: [{ $ref: "#/components/parameters/Id" }]
      responses:
        "200":
          description: Butacas
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items: { type: array, items: { $ref: "#/components/schemas/Seat" } }
  /v1/admin/seats/{id}:
    put:
      operationId: adminSetSeatBlocked
      security: [{ bearer: [] }]
      parameters: [{ $ref: "#/components/parameters/Id" }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [blocked]
              properties:
                blocked: { type: boolean }
      responses:
        "204": { description: Actualizado }
  /v1/admin/products:
    get:
      operationId: adminListProducts
      summary: Productos administrables (admin todos; seller los suyos)
      security: [{ bearer: [] }]
      responses:
        "200":
          description: Productos
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items: { type: array, items: { $ref: "#/components/schemas/Product" } }
    post:
      operationId: adminCreateProduct
      security: [{ bearer: [] }]
      requestBody: { $ref: "#/components/requestBodies/ProductInput" }
      responses:
        "201": { $ref: "#/components/responses/Product" }
        "409": { $ref: "./common.yaml#/components/responses/Problem" }
  /v1/admin/products/{id}:
    parameters: [{ $ref: "#/components/parameters/Id" }]
    put:
      operationId: adminUpdateProduct
      security: [{ bearer: [] }]
      requestBody: { $ref: "#/components/requestBodies/ProductInput" }
      responses:
        "200": { $ref: "#/components/responses/Product" }
    delete:
      operationId: adminDeleteProduct
      security: [{ bearer: [] }]
      responses:
        "204": { description: Eliminado }
components:
  securitySchemes:
    bearer:
      type: http
      scheme: bearer
      bearerFormat: JWT (EdDSA)
  parameters:
    Id:
      name: id
      in: path
      required: true
      schema: { type: string, format: uuid }
    Slug:
      name: slug
      in: path
      required: true
      schema: { type: string, pattern: "^[a-z0-9-]{1,80}$" }
  schemas:
    Money:
      $ref: "./common.yaml#/components/schemas/Money"
    Category:
      type: string
      enum: [conciertos, teatro, festivales, deportes, familia]
    EventStatus:
      type: string
      enum: [draft, published, soldout, archived]
    TicketType:
      type: object
      required: [id, name, price, fee, capacity, sectionId, sectionKind, sortOrder]
      properties:
        id: { type: string, format: uuid }
        name: { type: string }
        price: { $ref: "#/components/schemas/Money" }
        fee: { $ref: "#/components/schemas/Money" }
        capacity: { type: integer, minimum: 0 }
        sectionId: { type: string, format: uuid }
        sectionKind: { type: string, enum: [seated, general] }
        sortOrder: { type: integer }
    EventDate:
      type: object
      required: [id, startsAt, doorsAt, onSale, venue, ticketTypes]
      properties:
        id: { type: string, format: uuid }
        startsAt: { type: string, format: date-time }
        doorsAt: { type: [string, "null"], format: date-time }
        onSale: { type: boolean }
        venue:
          type: object
          required: [id, name, city]
          properties:
            id: { type: string, format: uuid }
            name: { type: string }
            city: { type: string }
        ticketTypes: { type: array, items: { $ref: "#/components/schemas/TicketType" } }
    EventSummary:
      type: object
      required:
        [
          id,
          slug,
          title,
          category,
          status,
          featured,
          imageUrl,
          nextDate,
          city,
          venueName,
          minPrice,
          capacity,
          datesCount,
        ]
      properties:
        id: { type: string, format: uuid }
        slug: { type: string }
        title: { type: string }
        artist: { type: [string, "null"] }
        category: { $ref: "#/components/schemas/Category" }
        description: { type: [string, "null"] }
        imageUrl: { type: [string, "null"] }
        status: { $ref: "#/components/schemas/EventStatus" }
        featured: { type: boolean }
        urgencyNote: { type: [string, "null"] }
        ageRestriction: { type: [string, "null"] }
        nextDate: { type: [string, "null"], format: date-time }
        city: { type: [string, "null"] }
        venueName: { type: [string, "null"] }
        minPrice:
          oneOf: [{ $ref: "#/components/schemas/Money" }, { type: "null" }]
        capacity: { type: integer }
        datesCount: { type: integer, description: Fechas futuras }
    Event:
      type: object
      required:
        [id, slug, title, category, status, featured, imageId, imageUrl, ownerId, queue, dates]
      properties:
        id: { type: string, format: uuid }
        slug: { type: string }
        title: { type: string }
        artist: { type: [string, "null"] }
        category: { $ref: "#/components/schemas/Category" }
        description: { type: [string, "null"] }
        imageId: { type: [string, "null"], format: uuid }
        imageUrl: { type: [string, "null"] }
        status: { $ref: "#/components/schemas/EventStatus" }
        featured: { type: boolean }
        urgencyNote: { type: [string, "null"] }
        ageRestriction: { type: [string, "null"] }
        ownerId: { type: [string, "null"], format: uuid }
        queue: { $ref: "#/components/schemas/QueueSettings" }
        dates: { type: array, items: { $ref: "#/components/schemas/EventDate" } }
    QueueSettings:
      type: object
      required: [enabled, opensAt, concurrentSlots, windowMinutes, admitBatchMax, waitingMessage]
      properties:
        enabled: { type: boolean }
        opensAt: { type: [string, "null"], format: date-time }
        concurrentSlots: { type: integer }
        windowMinutes: { type: integer }
        admitBatchMax: { type: integer }
        waitingMessage: { type: [string, "null"] }
    Section:
      type: object
      required: [id, venueId, name, kind, capacity, sortOrder, shape]
      properties:
        id: { type: string, format: uuid }
        venueId: { type: string, format: uuid }
        name: { type: string }
        kind: { type: string, enum: [seated, general] }
        capacity: { type: integer }
        sortOrder: { type: integer }
        shape: { $ref: "#/components/schemas/Shape" }
    Shape:
      type: object
      required: [x, y, w, h]
      properties:
        x: { type: number }
        y: { type: number }
        w: { type: number }
        h: { type: number }
    Venue:
      type: object
      required: [id, name, city, address, capacity, map, sections]
      properties:
        id: { type: string, format: uuid }
        name: { type: string }
        city: { type: string }
        address: { type: [string, "null"] }
        capacity: { type: integer }
        map:
          type: object
          required: [width, height]
          properties:
            width: { type: integer }
            height: { type: integer }
        sections: { type: array, items: { $ref: "#/components/schemas/Section" } }
    Seat:
      type: object
      required: [id, sectionId, row, number, x, y, blocked]
      properties:
        id: { type: string, format: uuid }
        sectionId: { type: string, format: uuid }
        row: { type: string }
        number: { type: integer }
        x: { type: number }
        y: { type: number }
        blocked: { type: boolean }
    SeatMap:
      type: object
      required: [date, sections, ticketTypes, seats]
      properties:
        date:
          type: object
          required: [id, startsAt, doorsAt, onSale, event, venue]
          properties:
            id: { type: string, format: uuid }
            startsAt: { type: string, format: date-time }
            doorsAt: { type: [string, "null"], format: date-time }
            onSale: { type: boolean }
            event:
              type: object
              required: [id, slug, title, status]
              properties:
                id: { type: string, format: uuid }
                slug: { type: string }
                title: { type: string }
                status: { $ref: "#/components/schemas/EventStatus" }
            venue:
              type: object
              required: [id, name, city, mapWidth, mapHeight]
              properties:
                id: { type: string, format: uuid }
                name: { type: string }
                city: { type: string }
                mapWidth: { type: integer }
                mapHeight: { type: integer }
        sections:
          type: array
          items:
            type: object
            required: [id, name, kind, capacity, sortOrder, shape]
            properties:
              id: { type: string, format: uuid }
              name: { type: string }
              kind: { type: string, enum: [seated, general] }
              capacity: { type: integer }
              sortOrder: { type: integer }
              shape: { $ref: "#/components/schemas/Shape" }
        ticketTypes: { type: array, items: { $ref: "#/components/schemas/TicketType" } }
        seats: { type: array, items: { $ref: "#/components/schemas/Seat" } }
    PublicProduct:
      type: object
      required: [id, slug, name, description, sku, price, fee, imageUrl, eventId, maxPerOrder]
      properties:
        id: { type: string, format: uuid }
        slug: { type: string }
        name: { type: string }
        description: { type: [string, "null"] }
        sku: { type: [string, "null"] }
        price: { $ref: "#/components/schemas/Money" }
        fee: { $ref: "#/components/schemas/Money" }
        imageUrl: { type: [string, "null"] }
        eventId: { type: [string, "null"], format: uuid }
        maxPerOrder: { type: integer }
    Product:
      allOf:
        - $ref: "#/components/schemas/PublicProduct"
        - type: object
          required: [imageId, status, ownerId]
          properties:
            imageId: { type: [string, "null"], format: uuid }
            status: { type: string, enum: [draft, active, archived] }
            ownerId: { type: [string, "null"], format: uuid }
    SellableItem:
      type: object
      required:
        [
          id,
          kind,
          name,
          unitPrice,
          unitFee,
          saleable,
          unsaleableReason,
          capacity,
          maxPerOrder,
          attributes,
        ]
      properties:
        id: { type: string, format: uuid }
        kind: { type: string }
        name: { type: string }
        unitPrice: { $ref: "#/components/schemas/Money" }
        unitFee: { $ref: "#/components/schemas/Money" }
        saleable: { type: boolean }
        unsaleableReason:
          type: [string, "null"]
          examples:
            [
              EVENT_NOT_PUBLISHED,
              EVENT_SOLD_OUT,
              DATE_NOT_ON_SALE,
              DATE_ALREADY_STARTED,
              NO_CAPACITY,
              PRODUCT_NOT_ACTIVE,
            ]
        capacity: { type: [integer, "null"] }
        maxPerOrder: { type: integer }
        attributes: { type: object }
    MoneyInput:
      oneOf:
        - { type: integer, minimum: 0, maximum: 1000000000 }
        - { type: string, pattern: '^\d{1,13}$' }
  requestBodies:
    EventInput:
      required: true
      content:
        application/json:
          schema:
            type: object
            additionalProperties: false
            required: [title, category, status, featured]
            properties:
              title: { type: string, maxLength: 140 }
              artist: { type: [string, "null"], maxLength: 140 }
              category: { $ref: "#/components/schemas/Category" }
              description: { type: [string, "null"], maxLength: 4000 }
              imageId: { type: [string, "null"], format: uuid }
              status: { $ref: "#/components/schemas/EventStatus" }
              featured: { type: boolean }
              urgencyNote: { type: [string, "null"], maxLength: 140 }
              ageRestriction: { type: [string, "null"], maxLength: 60 }
    DateInput:
      required: true
      content:
        application/json:
          schema:
            type: object
            additionalProperties: false
            required: [venueId, startsAt, onSale, ticketTypes]
            properties:
              venueId: { type: string, format: uuid }
              startsAt: { type: string, format: date-time }
              doorsAt: { type: [string, "null"], format: date-time }
              onSale: { type: boolean }
              ticketTypes:
                type: array
                maxItems: 50
                items:
                  type: object
                  additionalProperties: false
                  required: [sectionId, name, price, fee, capacity]
                  properties:
                    sectionId: { type: string, format: uuid }
                    name: { type: string, maxLength: 80 }
                    price: { $ref: "#/components/schemas/MoneyInput" }
                    fee: { $ref: "#/components/schemas/MoneyInput" }
                    capacity: { type: integer, minimum: 0, description: "≤ capacidad del sector" }
    VenueInput:
      required: true
      content:
        application/json:
          schema:
            type: object
            additionalProperties: false
            required: [name, city, capacity]
            properties:
              name: { type: string, maxLength: 120 }
              city: { type: string, maxLength: 80 }
              address: { type: [string, "null"], maxLength: 200 }
              capacity: { type: integer, minimum: 0 }
              mapWidth: { type: integer, minimum: 100, maximum: 5000 }
              mapHeight: { type: integer, minimum: 100, maximum: 5000 }
    SectionInput:
      required: true
      content:
        application/json:
          schema:
            type: object
            additionalProperties: false
            required: [name, kind, capacity, sortOrder, shape]
            properties:
              name: { type: string, maxLength: 80 }
              kind: { type: string, enum: [seated, general] }
              capacity: { type: integer, minimum: 0 }
              sortOrder: { type: integer, minimum: 0, maximum: 99 }
              shape: { $ref: "#/components/schemas/Shape" }
              seatGrid:
                type: object
                additionalProperties: false
                required: [rows, perRow]
                properties:
                  rows: { type: integer, minimum: 1, maximum: 60 }
                  perRow: { type: integer, minimum: 1, maximum: 80 }
    ProductInput:
      required: true
      content:
        application/json:
          schema:
            type: object
            additionalProperties: false
            required: [name, price, status]
            properties:
              name: { type: string, maxLength: 140 }
              description: { type: [string, "null"], maxLength: 4000 }
              sku: { type: [string, "null"], pattern: "^[A-Za-z0-9._-]{1,40}$" }
              price: { $ref: "#/components/schemas/MoneyInput" }
              fee: { $ref: "#/components/schemas/MoneyInput" }
              imageId: { type: [string, "null"], format: uuid }
              eventId: { type: [string, "null"], format: uuid }
              status: { type: string, enum: [draft, active, archived] }
              maxPerOrder: { type: integer, minimum: 1, maximum: 100 }
  responses:
    Event:
      description: Evento (vista de administración)
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Event" }
    Venue:
      description: Recinto
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Venue" }
    Product:
      description: Producto
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Product" }
