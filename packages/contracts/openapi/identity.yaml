openapi: 3.1.0
info:
  title: identity-service
  version: 1.0.0
  description: >
    Cuentas, sesiones y roles (reemplaza Supabase Auth, user_roles/has_role y auth.admin).
    Contraseñas con Argon2id; tokens de acceso JWT EdDSA de 15 min verificables con el JWKS;
    refresh tokens opacos, rotativos y revocables con detección de reutilización.
    Público vía gateway: `/auth/*` → `/v1/auth/*`, `/admin/users*` → `/v1/admin/users*`,
    `/.well-known/jwks.json`.
servers:
  - url: http://localhost:3001
security: []
paths:
  /health/live:
    $ref: "./common.yaml#/paths/~1health~1live"
  /health/ready:
    $ref: "./common.yaml#/paths/~1health~1ready"
  /.well-known/jwks.json:
    get:
      operationId: getJwks
      summary: Claves públicas para verificar tokens de acceso (incluye claves recién retiradas)
      responses:
        "200":
          description: JWKS
          content:
            application/json:
              schema:
                type: object
                required: [keys]
                properties:
                  keys:
                    type: array
                    items:
                      type: object
                      required: [kty, crv, x, kid, alg, use]
                      properties:
                        kty: { const: OKP }
                        crv: { const: Ed25519 }
                        x: { type: string }
                        kid: { type: string }
                        alg: { const: EdDSA }
                        use: { const: sig }
  /v1/auth/register:
    post:
      operationId: register
      summary: Registro. Responde igual exista o no el email (no permite enumerar cuentas)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [email, password, fullName]
              properties:
                email: { type: string, format: email, maxLength: 254 }
                password: { type: string, minLength: 10, maxLength: 128 }
                fullName: { type: string, minLength: 1, maxLength: 120 }
      responses:
        "202": { $ref: "#/components/responses/Accepted" }
        "400": { $ref: "./common.yaml#/components/responses/Problem" }
  /v1/auth/login:
    post:
      operationId: login
      summary: Inicia sesión. Bloquea la cuenta temporalmente tras varios fallos
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [email, password]
              properties:
                email: { type: string, format: email }
                password: { type: string, maxLength: 128 }
      responses:
        "200": { $ref: "#/components/responses/Session" }
        "400": { $ref: "./common.yaml#/components/responses/Problem" }
        "401":
          description: "`INVALID_CREDENTIALS` (genérico: no distingue email inexistente, contraseña errónea ni bloqueo)"
          content:
            application/problem+json:
              schema: { $ref: "./common.yaml#/components/schemas/Problem" }
        "403":
          description: "`ACCOUNT_DISABLED`"
          content:
            application/problem+json:
              schema: { $ref: "./common.yaml#/components/schemas/Problem" }
  /v1/auth/refresh:
    post:
      operationId: refresh
      summary: Rota el refresh token. Reutilizar uno ya rotado revoca la sesión completa
      requestBody: { $ref: "#/components/requestBodies/RefreshToken" }
      responses:
        "200": { $ref: "#/components/responses/Session" }
        "401":
          description: "`REFRESH_TOKEN_INVALID`, `_EXPIRED`, `_ROTATED` (carrera entre pestañas, reintentar con el token nuevo) o `_REUSED`"
          content:
            application/problem+json:
              schema: { $ref: "./common.yaml#/components/schemas/Problem" }
  /v1/auth/logout:
    post:
      operationId: logout
      summary: Cierra la sesión del refresh token (idempotente)
      requestBody: { $ref: "#/components/requestBodies/RefreshToken" }
      responses:
        "204": { description: Sesión cerrada }
  /v1/auth/logout-all:
    post:
      operationId: logoutAll
      summary: Cierra todas las sesiones del usuario
      security: [{ bearer: [] }]
      responses:
        "204": { description: Sesiones cerradas }
        "401": { $ref: "./common.yaml#/components/responses/Problem" }
  /v1/auth/me:
    get:
      operationId: getMe
      security: [{ bearer: [] }]
      responses:
        "200":
          description: Usuario actual
          content:
            application/json:
              schema: { $ref: "#/components/schemas/User" }
        "401": { $ref: "./common.yaml#/components/responses/Problem" }
    patch:
      operationId: updateMe
      security: [{ bearer: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [fullName]
              properties:
                fullName: { type: string, minLength: 1, maxLength: 120 }
      responses:
        "200":
          description: Usuario actualizado
          content:
            application/json:
              schema: { $ref: "#/components/schemas/User" }
        "400": { $ref: "./common.yaml#/components/responses/Problem" }
  /v1/auth/email/verify:
    post:
      operationId: verifyEmail
      summary: Consume el enlace de verificación (un solo uso, 24 h)
      requestBody: { $ref: "#/components/requestBodies/OneTimeToken" }
      responses:
        "204": { description: Email verificado }
        "400": { $ref: "./common.yaml#/components/responses/Problem" }
  /v1/auth/email/resend:
    post:
      operationId: resendVerification
      security: [{ bearer: [] }]
      responses:
        "202": { $ref: "#/components/responses/Accepted" }
  /v1/auth/password/forgot:
    post:
      operationId: forgotPassword
      summary: Envía un enlace de recuperación si la cuenta existe (respuesta siempre igual)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [email]
              properties:
                email: { type: string, format: email }
      responses:
        "202": { $ref: "#/components/responses/Accepted" }
  /v1/auth/password/reset:
    post:
      operationId: resetPassword
      summary: Restablece la contraseña con el enlace (1 h, un uso) y cierra todas las sesiones
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [token, newPassword]
              properties:
                token: { type: string }
                newPassword: { type: string, minLength: 10, maxLength: 128 }
      responses:
        "204": { description: Contraseña restablecida }
        "400": { $ref: "./common.yaml#/components/responses/Problem" }
  /v1/auth/password/change:
    post:
      operationId: changePassword
      summary: Cambia la contraseña y cierra las demás sesiones
      security: [{ bearer: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [currentPassword, newPassword]
              properties:
                currentPassword: { type: string }
                newPassword: { type: string, minLength: 10, maxLength: 128 }
      responses:
        "204": { description: Contraseña cambiada }
        "400": { $ref: "./common.yaml#/components/responses/Problem" }
  /v1/admin/users:
    get:
      operationId: listUsers
      summary: Lista usuarios (rol admin), paginado por cursor
      security: [{ bearer: [] }]
      parameters:
        - { name: q, in: query, schema: { type: string, maxLength: 100 } }
        - { name: role, in: query, schema: { $ref: "#/components/schemas/Role" } }
        - {
            name: limit,
            in: query,
            schema: { type: integer, minimum: 1, maximum: 100, default: 25 },
          }
        - { name: cursor, in: query, schema: { type: string } }
      responses:
        "200":
          description: Página de usuarios
          content:
            application/json:
              schema:
                type: object
                required: [items, nextCursor]
                properties:
                  items: { type: array, items: { $ref: "#/components/schemas/User" } }
                  nextCursor: { type: [string, "null"] }
        "403": { $ref: "./common.yaml#/components/responses/Problem" }
    post:
      operationId: createUser
      summary: Alta de cuentas de equipo (email ya verificado)
      security: [{ bearer: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [email, fullName, password, roles]
              properties:
                email: { type: string, format: email }
                fullName: { type: string }
                password: { type: string, minLength: 10, maxLength: 128 }
                roles: { type: array, minItems: 1, items: { $ref: "#/components/schemas/Role" } }
      responses:
        "201":
          description: Usuario creado
          content:
            application/json:
              schema: { $ref: "#/components/schemas/User" }
        "409": { $ref: "./common.yaml#/components/responses/Problem" }
  /v1/admin/users/{id}:
    get:
      operationId: getUser
      security: [{ bearer: [] }]
      parameters: [{ $ref: "#/components/parameters/UserId" }]
      responses:
        "200":
          description: Usuario
          content:
            application/json:
              schema: { $ref: "#/components/schemas/User" }
        "404": { $ref: "./common.yaml#/components/responses/Problem" }
  /v1/admin/users/{id}/roles:
    put:
      operationId: setUserRoles
      summary: Reemplaza los roles (cierra las sesiones del usuario; protege al último admin)
      security: [{ bearer: [] }]
      parameters: [{ $ref: "#/components/parameters/UserId" }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [roles]
              properties:
                roles: { type: array, items: { $ref: "#/components/schemas/Role" } }
      responses:
        "200":
          description: Usuario actualizado
          content:
            application/json:
              schema: { $ref: "#/components/schemas/User" }
        "403": { $ref: "./common.yaml#/components/responses/Problem" }
        "409": { $ref: "./common.yaml#/components/responses/Problem" }
  /v1/admin/users/{id}/disable:
    post:
      operationId: disableUser
      security: [{ bearer: [] }]
      parameters: [{ $ref: "#/components/parameters/UserId" }]
      responses:
        "200":
          description: Usuario deshabilitado (sesiones revocadas)
          content:
            application/json:
              schema: { $ref: "#/components/schemas/User" }
  /v1/admin/users/{id}/enable:
    post:
      operationId: enableUser
      security: [{ bearer: [] }]
      parameters: [{ $ref: "#/components/parameters/UserId" }]
      responses:
        "200":
          description: Usuario habilitado
          content:
            application/json:
              schema: { $ref: "#/components/schemas/User" }
components:
  securitySchemes:
    bearer:
      type: http
      scheme: bearer
      bearerFormat: JWT (EdDSA)
  parameters:
    UserId:
      name: id
      in: path
      required: true
      schema: { type: string, format: uuid }
  requestBodies:
    RefreshToken:
      required: true
      content:
        application/json:
          schema:
            type: object
            additionalProperties: false
            required: [refreshToken]
            properties:
              refreshToken: { type: string }
    OneTimeToken:
      required: true
      content:
        application/json:
          schema:
            type: object
            additionalProperties: false
            required: [token]
            properties:
              token: { type: string }
  responses:
    Accepted:
      description: Aceptado
      content:
        application/json:
          schema:
            type: object
            required: [status]
            properties:
              status: { const: accepted }
              message: { type: string }
    Session:
      description: Sesión iniciada
      headers:
        Cache-Control: { schema: { const: no-store } }
      content:
        application/json:
          schema:
            type: object
            required: [accessToken, tokenType, expiresIn, refreshToken, refreshExpiresAt, user]
            properties:
              accessToken: { type: string }
              tokenType: { const: Bearer }
              expiresIn: { type: integer }
              refreshToken: { type: string }
              refreshExpiresAt: { type: string, format: date-time }
              user: { $ref: "#/components/schemas/User" }
  schemas:
    Role:
      type: string
      enum: [customer, organizer, seller, staff, admin]
    User:
      type: object
      required: [id, email, fullName, roles, emailVerified, status, createdAt]
      properties:
        id: { type: string, format: uuid }
        email: { type: string, format: email }
        fullName: { type: string }
        roles: { type: array, items: { $ref: "#/components/schemas/Role" } }
        emailVerified: { type: boolean }
        status: { type: string, enum: [active, disabled] }
        createdAt: { type: string, format: date-time }
