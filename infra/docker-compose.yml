# Infraestructura local (vista física en pequeño). Solo para desarrollo y pruebas.
#   npm run infra:up      levanta todo y espera a que esté sano
#   npm run infra:down    detiene (conserva datos)
#   npm run infra:reset   detiene y borra volúmenes
# Las credenciales por defecto son solo de desarrollo; se sobrescriben con infra/.env.
name: ticketera

x-postgres-env: &postgres-env
  POSTGRES_USER: postgres
  POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres-dev-password}
  REPLICATION_PASSWORD: ${REPLICATION_PASSWORD:-replicator-dev-password}

services:
  postgres-primary:
    image: postgres:17-alpine
    environment:
      <<: *postgres-env
      POSTGRES_INITDB_ARGS: --auth-host=scram-sha-256 --data-checksums
      # Una base de datos (y un rol dueño) por servicio. `commons_test` es para pruebas de integración.
      SERVICE_DATABASES: identity catalog inventory orders payments tickets template commons_test
      # ADR-01: replicación síncrona. Vacío = asíncrona (útil si se trabaja sin la réplica).
      PG_SYNC_STANDBY_NAMES: ${PG_SYNC_STANDBY_NAMES-ANY 1 (replica1)}
    command:
      - postgres
      - -c
      - wal_level=replica
      - -c
      - max_wal_senders=10
      - -c
      - max_replication_slots=10
      - -c
      - synchronous_commit=on
      - -c
      - password_encryption=scram-sha-256
      - -c
      - max_connections=300
    volumes:
      - postgres-primary:/var/lib/postgresql/data
      - ./postgres/primary-init.sh:/docker-entrypoint-initdb.d/00-primary-init.sh:ro
    ports:
      - "127.0.0.1:5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d postgres"]
      interval: 2s
      timeout: 3s
      retries: 30

  postgres-replica:
    image: postgres:17-alpine
    user: postgres
    environment:
      <<: *postgres-env
      PGDATA: /var/lib/postgresql/data/pgdata
      PRIMARY_HOST: postgres-primary
      REPLICA_NAME: replica1
    entrypoint: ["bash", "/replica-entrypoint.sh"]
    # Debe coincidir con la primaria (un hot standby no puede tener menos conexiones).
    command: ["-c", "max_connections=300"]
    volumes:
      - postgres-replica:/var/lib/postgresql/data
      - ./postgres/replica-entrypoint.sh:/replica-entrypoint.sh:ro
    ports:
      - "127.0.0.1:5433:5432"
    depends_on:
      postgres-primary:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d postgres"]
      interval: 2s
      timeout: 3s
      retries: 60

  redis-primary:
    image: redis:8-alpine
    command:
      - redis-server
      - --requirepass
      - ${REDIS_PASSWORD:-redis-dev-password}
      - --masterauth
      - ${REDIS_PASSWORD:-redis-dev-password}
      - --appendonly
      - "yes"
      - --appendfsync
      - everysec
    volumes:
      - redis-primary:/data
    ports:
      - "127.0.0.1:6379:6379"
    healthcheck:
      test: ["CMD-SHELL", 'redis-cli -a "$$REDIS_PASSWORD" --no-auth-warning ping | grep -q PONG']
      interval: 2s
      timeout: 3s
      retries: 30
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD:-redis-dev-password}

  redis-replica:
    image: redis:8-alpine
    command:
      - redis-server
      - --replicaof
      - redis-primary
      - "6379"
      - --masterauth
      - ${REDIS_PASSWORD:-redis-dev-password}
      - --requirepass
      - ${REDIS_PASSWORD:-redis-dev-password}
      - --replica-read-only
      - "yes"
    volumes:
      - redis-replica:/data
    ports:
      - "127.0.0.1:6380:6379"
    depends_on:
      redis-primary:
        condition: service_healthy
    healthcheck:
      test:
        - CMD-SHELL
        - redis-cli -a "$$REDIS_PASSWORD" --no-auth-warning info replication | grep -q 'master_link_status:up'
      interval: 2s
      timeout: 3s
      retries: 30
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD:-redis-dev-password}

  rabbitmq:
    image: rabbitmq:4-management-alpine
    hostname: rabbitmq
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USER:-ticketera}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD:-rabbitmq-dev-password}
    volumes:
      - rabbitmq:/var/lib/rabbitmq
    ports:
      - "127.0.0.1:5672:5672"
      - "127.0.0.1:15672:15672"
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "check_port_connectivity"]
      interval: 5s
      timeout: 10s
      retries: 30

  mailpit:
    image: axllent/mailpit:v1.29
    environment:
      MP_SMTP_AUTH_ACCEPT_ANY: "true"
      MP_SMTP_AUTH_ALLOW_INSECURE: "true"
    ports:
      - "127.0.0.1:1025:1025"
      - "127.0.0.1:8025:8025"
    healthcheck:
      test: ["CMD", "/mailpit", "readyz"]
      interval: 5s
      timeout: 3s
      retries: 20

  nginx:
    build:
      context: ..
      dockerfile: infra/nginx/Dockerfile
    ports:
      - "127.0.0.1:8088:80"
      - "127.0.0.1:8443:443"
    volumes:
      - nginx-certs:/etc/nginx/certs
    extra_hosts:
      - "host.docker.internal:host-gateway"
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1/health | grep -q ok"]
      interval: 5s
      timeout: 3s
      retries: 20

  # --- Servicios (Fase 2) ---
  identity:
    build:
      context: ..
      dockerfile: services/identity/Dockerfile
    init: true
    # ADR-01: réplicas sin estado; comparten BD (claves de firma, migraciones con advisory lock).
    deploy:
      replicas: 2
    environment:
      SERVICE_NAME: identity
      PORT: "3000"
      LOG_LEVEL: info
      DATABASE_URL: postgres://identity:${PG_PASSWORD_IDENTITY:-identity-dev-password}@postgres-primary:5432/identity
      AMQP_URL: amqp://${RABBITMQ_USER:-ticketera}:${RABBITMQ_PASSWORD:-rabbitmq-dev-password}@rabbitmq:5672
      KEY_ENCRYPTION_SECRET: ${IDENTITY_KEY_ENCRYPTION_SECRET:-ZGV2LW9ubHkta2V5LWVuY3J5cHRpb24tc2VjcmV0ISE=}
      PUBLIC_WEB_URL: ${PUBLIC_WEB_URL:-https://localhost:8443}
      BOOTSTRAP_ADMIN_EMAIL: ${BOOTSTRAP_ADMIN_EMAIL:-admin@ticketera.local}
      BOOTSTRAP_ADMIN_PASSWORD: ${BOOTSTRAP_ADMIN_PASSWORD:-admin-dev-password-123}
    depends_on:
      postgres-primary:
        condition: service_healthy
      postgres-replica:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy

  catalog:
    build:
      context: ..
      dockerfile: services/catalog/Dockerfile
    init: true
    # ADR-01/02: réplicas sin estado; la caché de lectura vive en Redis (compartida).
    deploy:
      replicas: 2
    environment:
      SERVICE_NAME: catalog
      PORT: "3000"
      LOG_LEVEL: info
      DATABASE_URL: postgres://catalog:${PG_PASSWORD_CATALOG:-catalog-dev-password}@postgres-primary:5432/catalog
      REDIS_URL: redis://:${REDIS_PASSWORD:-redis-dev-password}@redis-primary:6379
      AMQP_URL: amqp://${RABBITMQ_USER:-ticketera}:${RABBITMQ_PASSWORD:-rabbitmq-dev-password}@rabbitmq:5672
      JWKS_URL: http://identity:3000/.well-known/jwks.json
      CACHE_TTL_SECONDS: "30"
      MEDIA_PUBLIC_PATH: /api/catalog/media
      # Datos de demostración del prototipo (solo si el catálogo está vacío).
      SEED_DEMO_DATA: ${CATALOG_SEED_DEMO_DATA:-true}
    depends_on:
      postgres-primary:
        condition: service_healthy
      redis-primary:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      identity:
        condition: service_healthy

  queue:
    build:
      context: ..
      dockerfile: services/queue/Dockerfile
    init: true
    # ADR-06: estado de la fila en Redis; el admisor corre en todas las réplicas con lock de líder.
    deploy:
      replicas: 2
    environment:
      SERVICE_NAME: queue
      PORT: "3000"
      LOG_LEVEL: info
      REDIS_URL: redis://:${REDIS_PASSWORD:-redis-dev-password}@redis-primary:6379
      AMQP_URL: amqp://${RABBITMQ_USER:-ticketera}:${RABBITMQ_PASSWORD:-rabbitmq-dev-password}@rabbitmq:5672
      JWKS_URL: http://identity:3000/.well-known/jwks.json
      CATALOG_URL: http://catalog:3000
      # Solo desarrollo: clave Ed25519 de los tokens de admisión (cámbiala fuera de desarrollo).
      ADMISSION_SIGNING_KEY: ${QUEUE_ADMISSION_SIGNING_KEY:-LS0tLS1CRUdJTiBQUklWQVRFIEtFWS0tLS0tCk1DNENBUUF3QlFZREsyVndCQ0lFSUcvc2IrYjhzLy8rQ2dKSkJYM200RFZ3WTgySjN5OFJzVm04dHEremo4VUIKLS0tLS1FTkQgUFJJVkFURSBLRVktLS0tLQo=}
    depends_on:
      redis-primary:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      catalog:
        condition: service_healthy

  inventory:
    build:
      context: ..
      dockerfile: services/inventory/Dockerfile
    init: true
    deploy:
      replicas: 2
    environment:
      SERVICE_NAME: inventory
      PORT: "3000"
      LOG_LEVEL: info
      DATABASE_URL: postgres://inventory:${PG_PASSWORD_INVENTORY:-inventory-dev-password}@postgres-primary:5432/inventory
      DB_POOL_MAX: "20"
      REDIS_URL: redis://:${REDIS_PASSWORD:-redis-dev-password}@redis-primary:6379
      AMQP_URL: amqp://${RABBITMQ_USER:-ticketera}:${RABBITMQ_PASSWORD:-rabbitmq-dev-password}@rabbitmq:5672
      JWKS_URL: http://identity:3000/.well-known/jwks.json
      QUEUE_JWKS_URL: http://queue:3000/.well-known/jwks.json
      INTERNAL_API_TOKEN: ${INTERNAL_API_TOKEN:-internal-dev-token-change-me-0123456789}
      CATALOG_URL: http://catalog:3000
    depends_on:
      postgres-primary:
        condition: service_healthy
      redis-primary:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      catalog:
        condition: service_healthy
      queue:
        condition: service_healthy

  # Único mock del sistema (ADR-07): imita Webpay Plus. El formulario se ve en /webpay/ vía Nginx.
  webpay-mock:
    build:
      context: ..
      dockerfile: services/webpay-mock/Dockerfile
    init: true
    environment:
      SERVICE_NAME: webpay-mock
      PORT: "3000"
      LOG_LEVEL: info
      REDIS_URL: redis://:${REDIS_PASSWORD:-redis-dev-password}@redis-primary:6379
      WEBPAY_API_KEY_ID: ${WEBPAY_API_KEY_ID:-597055555532}
      WEBPAY_API_KEY_SECRET: ${WEBPAY_API_KEY_SECRET:-webpay-mock-dev-secret-0123456789}
      WEBPAY_FORM_URL: ${PUBLIC_WEB_URL:-https://localhost:8443}/webpay/form
      WEBPAY_MOCK_DEFAULT_OUTCOME: ${WEBPAY_MOCK_DEFAULT_OUTCOME:-reject}
      WEBPAY_MOCK_LATENCY_MS: ${WEBPAY_MOCK_LATENCY_MS:-0}
      WEBPAY_MOCK_COMMIT_LOSS_RATIO: ${WEBPAY_MOCK_COMMIT_LOSS_RATIO:-0}
      WEBPAY_MOCK_ERROR_RATIO: ${WEBPAY_MOCK_ERROR_RATIO:-0}
    ports:
      # Desarrollo: el simulador de carga y Vite llegan al formulario sin pasar por Nginx.
      - "127.0.0.1:3005:3000"
    depends_on:
      redis-primary:
        condition: service_healthy

  payments:
    build:
      context: ..
      dockerfile: services/payments/Dockerfile
    init: true
    deploy:
      replicas: 2
    environment:
      SERVICE_NAME: payments
      PORT: "3000"
      LOG_LEVEL: info
      DATABASE_URL: postgres://payments:${PG_PASSWORD_PAYMENTS:-payments-dev-password}@postgres-primary:5432/payments
      REDIS_URL: redis://:${REDIS_PASSWORD:-redis-dev-password}@redis-primary:6379
      AMQP_URL: amqp://${RABBITMQ_USER:-ticketera}:${RABBITMQ_PASSWORD:-rabbitmq-dev-password}@rabbitmq:5672
      JWKS_URL: http://identity:3000/.well-known/jwks.json
      INTERNAL_API_TOKEN: ${INTERNAL_API_TOKEN:-internal-dev-token-change-me-0123456789}
      ORDERS_URL: http://orders:3000
      WEBPAY_URL: http://webpay-mock:3000
      WEBPAY_API_KEY_ID: ${WEBPAY_API_KEY_ID:-597055555532}
      WEBPAY_API_KEY_SECRET: ${WEBPAY_API_KEY_SECRET:-webpay-mock-dev-secret-0123456789}
      PAYMENT_RETURN_URL: ${PUBLIC_WEB_URL:-https://localhost:8443}/api/payments/return
      PUBLIC_WEB_URL: ${PUBLIC_WEB_URL:-https://localhost:8443}
    depends_on:
      postgres-primary:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      webpay-mock:
        condition: service_healthy

  orders:
    build:
      context: ..
      dockerfile: services/orders/Dockerfile
    init: true
    deploy:
      replicas: 2
    environment:
      SERVICE_NAME: orders
      PORT: "3000"
      LOG_LEVEL: info
      DATABASE_URL: postgres://orders:${PG_PASSWORD_ORDERS:-orders-dev-password}@postgres-primary:5432/orders
      REDIS_URL: redis://:${REDIS_PASSWORD:-redis-dev-password}@redis-primary:6379
      AMQP_URL: amqp://${RABBITMQ_USER:-ticketera}:${RABBITMQ_PASSWORD:-rabbitmq-dev-password}@rabbitmq:5672
      JWKS_URL: http://identity:3000/.well-known/jwks.json
      INTERNAL_API_TOKEN: ${INTERNAL_API_TOKEN:-internal-dev-token-change-me-0123456789}
      INVENTORY_URL: http://inventory:3000
      CATALOG_URL: http://catalog:3000
      PAYMENTS_URL: http://payments:3000
      SEED_DEMO_DATA: ${ORDERS_SEED_DEMO_DATA:-true}
    depends_on:
      postgres-primary:
        condition: service_healthy
      redis-primary:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      inventory:
        condition: service_healthy
      payments:
        condition: service_healthy

  tickets:
    build:
      context: ..
      dockerfile: services/tickets/Dockerfile
    init: true
    deploy:
      replicas: 2
    environment:
      SERVICE_NAME: tickets
      PORT: "3000"
      LOG_LEVEL: info
      DATABASE_URL: postgres://tickets:${PG_PASSWORD_TICKETS:-tickets-dev-password}@postgres-primary:5432/tickets
      AMQP_URL: amqp://${RABBITMQ_USER:-ticketera}:${RABBITMQ_PASSWORD:-rabbitmq-dev-password}@rabbitmq:5672
      JWKS_URL: http://identity:3000/.well-known/jwks.json
      CATALOG_URL: http://catalog:3000
      # Solo desarrollo: clave Ed25519 que firma el QR de las entradas (cámbiala fuera de desarrollo).
      TICKET_SIGNING_KEY: ${TICKET_SIGNING_KEY:-LS0tLS1CRUdJTiBQUklWQVRFIEtFWS0tLS0tCk1DNENBUUF3QlFZREsyVndCQ0lFSUJCdHNTQk5LYzNrbldMYzRpdGdyaDRrb2YxN1hqMkdRZUFsRmZQd1hoWS8KLS0tLS1FTkQgUFJJVkFURSBLRVktLS0tLQo=}
    depends_on:
      postgres-primary:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      catalog:
        condition: service_healthy

  gateway:
    build:
      context: ..
      dockerfile: services/gateway/Dockerfile
    init: true
    environment:
      SERVICE_NAME: gateway
      PORT: "3000"
      LOG_LEVEL: info
      REDIS_URL: redis://:${REDIS_PASSWORD:-redis-dev-password}@redis-primary:6379
      # El DNS de Docker reparte entre las réplicas de identity.
      IDENTITY_URLS: http://identity:3000
      CATALOG_URLS: http://catalog:3000
      QUEUE_URLS: http://queue:3000
      INVENTORY_URLS: http://inventory:3000
      ORDERS_URLS: http://orders:3000
      PAYMENTS_URLS: http://payments:3000
      TICKETS_URLS: http://tickets:3000
      CORS_ORIGINS: ${CORS_ORIGINS:-https://localhost:8443}
    ports:
      # La web (BFF) en desarrollo llama al gateway directo; el navegador entra por Nginx.
      - "127.0.0.1:3000:3000"
    depends_on:
      redis-primary:
        condition: service_healthy
      identity:
        condition: service_healthy
      catalog:
        condition: service_healthy
      queue:
        condition: service_healthy
      inventory:
        condition: service_healthy
      orders:
        condition: service_healthy
      payments:
        condition: service_healthy
      tickets:
        condition: service_healthy

  # Plantilla de servicio: `docker compose --profile template up -d --build template`.
  template:
    profiles: ["template"]
    build:
      context: ..
      dockerfile: services/template/Dockerfile
    init: true
    environment:
      SERVICE_NAME: template
      PORT: "3000"
      LOG_LEVEL: info
      DATABASE_URL: postgres://template:${PG_PASSWORD_TEMPLATE:-template-dev-password}@postgres-primary:5432/template
      REDIS_URL: redis://:${REDIS_PASSWORD:-redis-dev-password}@redis-primary:6379
      AMQP_URL: amqp://${RABBITMQ_USER:-ticketera}:${RABBITMQ_PASSWORD:-rabbitmq-dev-password}@rabbitmq:5672
    ports:
      - "127.0.0.1:3900:3000"
    depends_on:
      postgres-primary:
        condition: service_healthy
      redis-primary:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy

volumes:
  postgres-primary:
  postgres-replica:
  redis-primary:
  redis-replica:
  rabbitmq:
  nginx-certs:
