# Borde local: TLS 1.3 (ADR-04) y balanceo hacia el gateway (ADR-01).
# En producción este rol lo cumple el balanceador/WAF de la vista física.

map $http_upgrade $connection_upgrade {
  default upgrade;
  "" close;
}

# Límite grueso por IP en el borde; el gateway aplica límites finos por usuario y ruta.
limit_req_zone $binary_remote_addr zone=edge:10m rate=50r/s;

server {
  listen 80;
  server_name _;

  location = /health {
    access_log off;
    return 200 "ok\n";
  }

  location / {
    return 308 https://$host:8443$request_uri;
  }
}

server {
  listen 443 ssl;
  http2 on;
  server_name localhost;

  ssl_certificate /etc/nginx/certs/tls.crt;
  ssl_certificate_key /etc/nginx/certs/tls.key;
  ssl_protocols TLSv1.3;
  ssl_prefer_server_ciphers off;
  ssl_session_cache shared:TLS:10m;
  ssl_session_timeout 1h;
  ssl_session_tickets off;

  add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
  add_header X-Content-Type-Options "nosniff" always;
  add_header Referrer-Policy "strict-origin-when-cross-origin" always;
  add_header X-Frame-Options "DENY" always;

  limit_req zone=edge burst=100 nodelay;
  limit_req_status 429;

  proxy_http_version 1.1;
  proxy_set_header Host $host;
  proxy_set_header X-Request-Id $request_id;
  proxy_set_header X-Real-IP $remote_addr;
  proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
  proxy_set_header X-Forwarded-Proto https;
  # Con varias réplicas (el DNS de Docker devuelve todas), si una no acepta la conexión se prueba
  # la siguiente: la solicitud aún no se envió, así que es seguro incluso para POST.
  proxy_connect_timeout 1s;
  proxy_next_upstream error timeout;
  proxy_next_upstream_tries 3;
  proxy_read_timeout 30s;

  location = /health {
    access_log off;
    return 200 "ok\n";
  }

  # Imágenes del catálogo: cacheadas en el borde; los reintentos simultáneos esperan una sola
  # descarga (cache_lock) en vez de golpear al catálogo.
  location /api/catalog/media/ {
    set $gateway_upstream http://gateway:3000;
    rewrite ^/api/(.*)$ /$1 break;
    proxy_cache media;
    proxy_cache_valid 200 7d;
    proxy_cache_lock on;
    proxy_cache_use_stale error timeout updating;
    proxy_pass $gateway_upstream;
  }

  # App de validación en puerta (RF15): estática, mismo origen que /api. La cámara solo se
  # permite aquí.
  location /scanner/ {
    alias /usr/share/nginx/scanner/;
    try_files $uri $uri/ /scanner/index.html;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "no-referrer" always;
    add_header X-Frame-Options "DENY" always;
    add_header Permissions-Policy "camera=(self)" always;
    add_header Content-Security-Policy "default-src 'self'; img-src 'self' data: blob:; media-src 'self' blob:; style-src 'self'; script-src 'self'; connect-src 'self'; frame-ancestors 'none'" always;
  }

  # Formulario de pago del adquirente simulado (ADR-07). En producción es el sitio de Transbank.
  location /webpay/ {
    set $webpay_upstream http://webpay-mock:3000;
    proxy_pass $webpay_upstream;
  }

  # API: todo pasa por el gateway.
  location /api/ {
    set $gateway_upstream http://gateway:3000;
    rewrite ^/api/(.*)$ /$1 break;
    proxy_pass $gateway_upstream;
  }

  # Web (TanStack Start, SSR): contenedores `web` del compose (2 réplicas, DNS de Docker).
  location / {
    set $web_upstream http://web:3000;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection $connection_upgrade;
    proxy_pass $web_upstream;
  }
}
