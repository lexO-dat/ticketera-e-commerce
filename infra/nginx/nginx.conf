worker_processes auto;

events {
  worker_connections 4096;
}

http {
  include /etc/nginx/mime.types;
  default_type application/octet-stream;

  server_tokens off;
  sendfile on;
  keepalive_timeout 65;
  client_max_body_size 10m;

  # Logs JSON con el request-id, para correlacionar con los logs de los servicios.
  log_format json escape=json '{"time":"$time_iso8601","requestId":"$request_id",'
    '"remote":"$remote_addr","method":"$request_method","uri":"$uri","status":$status,'
    '"bytes":$body_bytes_sent,"duration":$request_time,"upstream":"$upstream_addr"}';
  access_log /dev/stdout json;
  error_log /dev/stderr warn;

  # DNS interno de Docker: resolver en tiempo de solicitud permite arrancar Nginx aunque un
  # servicio todavía no exista (responde 502 hasta que aparezca).
  # `valid` corto: una réplica que muere sale de la rotación en segundos (ADR-01).
  resolver 127.0.0.11 valid=2s ipv6=off;

  # Caché de borde para las imágenes del catálogo (inmutables: el id nunca cambia de contenido).
  proxy_cache_path /var/cache/nginx/media levels=1:2 keys_zone=media:10m max_size=1g
    inactive=7d use_temp_path=off;

  include /etc/nginx/conf.d/*.conf;
}
