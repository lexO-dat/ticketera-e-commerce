<!doctype html>
<html lang="es">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="color-scheme" content="light only" />
    <title>{{ subject }}</title>
  </head>
  <body style="margin:0;padding:0;background:#f4f1ec;font-family:Helvetica,Arial,sans-serif;color:#1d1d1b;">
    <span style="display:none;max-height:0;overflow:hidden;">{{ preheader }}</span>
    <table role="presentation" width="100%" cellpadding="0" cellspacing="0" style="background:#f4f1ec;">
      <tr>
        <td align="center" style="padding:32px 16px;">
          <table role="presentation" width="100%" cellpadding="0" cellspacing="0" style="max-width:560px;background:#ffffff;border-radius:16px;">
            <tr>
              <td style="padding:28px 32px 0;font-size:14px;letter-spacing:0.12em;text-transform:uppercase;color:#6b6b66;">
                Ticketera
              </td>
            </tr>
            <tr>
              <td style="padding:12px 32px 32px;font-size:16px;line-height:1.55;">
                {% block content %}{% endblock %}
              </td>
            </tr>
          </table>
          <p style="max-width:560px;margin:16px auto 0;font-size:12px;line-height:1.5;color:#6b6b66;">
            Este correo se envió automáticamente; no lo respondas. Si no reconoces esta acción,
            puedes ignorarlo.
          </p>
        </td>
      </tr>
    </table>
  </body>
</html>
